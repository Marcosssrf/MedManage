spring:
  application:
    name: sistemaClinica
  datasource:
    url: jdbc:postgresql://localhost:5434/clinica
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false