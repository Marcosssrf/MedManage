spring:
  port: ${PORT:8080}
  application:
    name: sistemaClinica
  datasource:
    url: jdbc:postgresql://${DB_URL}
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false