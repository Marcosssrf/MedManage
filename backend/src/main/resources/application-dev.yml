spring:
  application:
    name: sistemaClinica
  datasource:
    url: ${DB_URL_POOLER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY}
gemini:
  api:
    key: ${GEMINI_API_KEY}